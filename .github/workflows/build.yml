name: Build
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            make release
          else
            make release-snapshot
          fi
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            dist/
            !dist/*/*
