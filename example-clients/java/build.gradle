// see https://docs.gradle.org/9.4/userguide/java_plugin.html
// see https://docs.gradle.org/9.4/userguide/application_plugin.html
// see https://gradleup.com/shadow/
// see https://github.com/GradleUp/shadow

plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.4.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'net.example.Example'
}

version = '1.0.0'

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Java TLS client example',
            'Implementation-Version': project.version,
        )
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // see https://logging.apache.org/log4j/2.x/manual/installation.html
    implementation platform('org.apache.logging.log4j:log4j-bom:2.25.4')
    implementation 'org.apache.logging.log4j:log4j-api:${log4j-api.version}'
    runtimeOnly 'org.apache.logging.log4j:log4j-core'
}